services:
  - type: web
    name: kindr-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false # Set your Gmail address in Render Dashboard
      - key: SMTP_PASS
        sync: false # Set your Google App Password in Render Dashboard
      - key: EMAIL_FROM
        value: Kindr Ecosystem <ht20041975@gmail.com>
